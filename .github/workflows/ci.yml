name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, synthetic ELF64, fuzz, and ground-truth tests
        run: cargo test --all-targets

      - name: Build release binary and run Linux smoke scan
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          ./target/release/bincompat scan /usr/bin/env
